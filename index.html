<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Kid's Paint App</title>
    <link rel="stylesheet" href="css/style.css">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>

</head>
<body>
    <div id="app">
        <!-- Fullscreen Entry Point -->
        <div id="start-screen">
            <button id="start-button">🎨</button>
        </div>

        <!-- Main Menu / Dashboard -->
        <div id="dashboard" class="screen hidden">
            <div class="menu-container">
                <button id="new-drawing" class="menu-button">✏️</button>
                <div class="mode-buttons">
                    <button id="paint-mode-btn" class="mode-button">🖌️</button>
                    <button id="3d-mode-btn" class="mode-button">🧊</button>
                    <button id="gallery-mode-btn" class="mode-button">🖼️</button>
                    <button id="magic-mode-btn" class="mode-button">✨</button>
                </div>
                <div id="saved-thumbnails" class="thumbnails-container"></div>
            </div>
        </div>

        <!-- Paint Mode -->
        <div id="paint-mode" class="screen hidden">
            <canvas id="paint-canvas"></canvas>
            <div class="toolbar">
                <div class="toolbar-scroller">
                    <button class="tool-button" data-tool="color" data-color="#FF0000">🔴</button>
                    <button class="tool-button" data-tool="color" data-color="#00FF00">🟢</button>
                    <button class="tool-button" data-tool="color" data-color="#0000FF">🔵</button>
                    <button class="tool-button" data-tool="color" data-color="#FFFF00">🟡</button>
                    <button class="tool-button" data-tool="color" data-color="#FF00FF">💖</button>
                    <button class="tool-button" data-tool="color" data-color="#00FFFF">💙</button>
                    <button class="tool-button" data-tool="color" data-color="#FFFFFF">⚪</button>
                    <button class="tool-button" data-tool="color" data-color="#000000">⚫</button>
                    
                    <button class="tool-button" data-tool="size" data-size="small">●</button>
                    <button class="tool-button" data-tool="size" data-size="medium">●●</button>
                    <button class="tool-button" data-tool="size" data-size="large">●●●</button>
                    
                    <button class="tool-button" data-tool="brush" data-brush="basic">🖌️</button>
                    <button class="tool-button" data-tool="brush" data-brush="eraser">🧽</button>
                    <button class="tool-button" data-tool="clear">🗑️</button>
                    <button class="tool-button" data-tool="save">💾</button>
                    <button class="tool-button" data-tool="home">🏠</button>
                </div>
            </div>
        </div>

        <!-- 3D Mode -->
        <div id="three-d-mode" class="screen hidden">
            <canvas id="three-d-canvas"></canvas>
            <div class="toolbar">
                <div class="toolbar-scroller">
                    <button class="tool-button" data-shape="cube">🧊</button>
                    <button class="tool-button" data-shape="sphere">⚽</button>
                    <button class="tool-button" data-shape="cone">🏠</button>
                    <button class="tool-button" data-shape="cylinder">🥫</button>
                    
                    <button class="tool-button" data-tool="color" data-color="#FF0000">🔴</button>
                    <button class="tool-button" data-tool="color" data-color="#00FF00">🟢</button>
                    <button class="tool-button" data-tool="color" data-color="#0000FF">🔵</button>
                    <button class="tool-button" data-tool="color" data-color="#FFFF00">🟡</button>
                    
                    <button class="tool-button" data-tool="clear">🗑️</button>
                    <button class="tool-button" data-tool="home">🏠</button>
                </div>
            </div>
        </div>

        <!-- Gallery Mode -->
        <div id="gallery-mode" class="screen hidden">
            <div id="gallery-container" class="thumbnails-container"></div>
            <div class="toolbar">
                <div class="toolbar-scroller">
                    <button class="tool-button" data-tool="home">🏠</button>
                </div>
            </div>
        </div>

        <!-- Magic Mode -->
        <div id="magic-mode" class="screen hidden">
            <canvas id="magic-canvas"></canvas>
            <div class="toolbar">
                <div class="toolbar-scroller">
                    <button class="tool-button" data-magic="rainbow">🌈</button>
                    <button class="tool-button" data-magic="mirror">🪞</button>
                    <button class="tool-button" data-magic="splatter">💦</button>
                    <button class="tool-button" data-magic="wiggly">〰️</button>
                    <button class="tool-button" data-magic="liquid">💧</button>
                    <button class="tool-button" data-magic="surprise">🎲</button>
                    <button class="tool-button" data-magic="fire">🔥</button>
                    <button class="tool-button" data-magic="galaxy">🌌</button>
                    
                    <button class="tool-button" data-tool="clear">🗑️</button>
                    <button class="tool-button" data-tool="save">💾</button>
                    <button class="tool-button" data-tool="home">🏠</button>
                </div>
            </div>
        </div>
    </div>

    <!-- Scripts -->
    <script src="js/storage.js"></script>
    <script src="js/paintMode.js"></script>
    <script src="js/threeDMode.js"></script>
    <script src="js/galleryMode.js"></script>
    <script src="js/magicMode.js"></script>
    <script src="js/main.js"></script>
</body>
</html>
