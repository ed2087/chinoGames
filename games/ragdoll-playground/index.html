<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Ragdoll Playground</title>
    <script src="../../js/global.js"></script>
    <link rel="stylesheet" href="../../styles/global.css">
    <link rel="stylesheet" href="game.css">
</head>
<body>
    <!-- Minimal top navigation -->
    <nav class="game-nav">
        <a href="../../index.html" class="home-btn" aria-label="Home">🏠</a>
        <div class="game-title">Ragdoll Playground</div>
    </nav>
    
    <!-- Full screen physics playground -->
    <main class="game-main">
        <canvas id="gameCanvas"></canvas>
        
        <!-- Floating control panel -->
        <div class="controls-panel">
            <button class="control-btn primary" id="changeTypeBtn" data-tooltip="Change Character">
                <span class="btn-icon">🔄</span>
                <span class="btn-text">Change</span>
            </button>
            <button class="control-btn secondary" id="spawnBtn" data-tooltip="Spawn New Ragdoll">
                <span class="btn-icon">➕</span>
                <span class="btn-text">Spawn</span>
            </button>
            <button class="control-btn danger" id="explodeBtn" data-tooltip="Explode All">
                <span class="btn-icon">💥</span>
                <span class="btn-text">Explode</span>
            </button>
            <button class="control-btn info" id="resetBtn" data-tooltip="Reset Scene">
                <span class="btn-icon">🔄</span>
                <span class="btn-text">Reset</span>
            </button>
        </div>
        
        <!-- Character info display -->
        <div class="character-info" id="characterInfo">
            <div class="character-type">
                <span class="type-icon" id="typeIcon">🧸</span>
                <span class="type-name" id="typeName">Teddy Bear</span>
            </div>
            <div class="ragdoll-count">
                <span class="count-label">Ragdolls:</span>
                <span class="count-value" id="ragdollCount">1</span>
            </div>
        </div>
        
        <!-- Physics debug info (hidden by default) -->
        <div class="debug-info" id="debugInfo">
            <div class="fps">FPS: <span id="fpsCounter">60</span></div>
            <div class="bodies">Bodies: <span id="bodyCount">0</span></div>
            <div class="particles">Particles: <span id="particleCount">0</span></div>
        </div>
        
        <!-- Loading screen -->
        <div class="loading-screen" id="loadingScreen">
            <div class="loading-content">
                <div class="loading-spinner"></div>
                <div class="loading-text">Loading Physics Engine...</div>
            </div>
        </div>
    </main>
    
    <!-- Physics Engine -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/matter-js/0.20.0/matter.min.js"></script>
    
    <!-- Audio System -->
    <script src="../../js/audio-system.js"></script>
    
    <!-- Core Engine Files -->
    <script src="js/utils/MathUtils.js"></script>
    <script src="js/utils/DeviceUtils.js"></script>
    
    <!-- Physics System -->
    <script src="js/physics/PhysicsEngine.js"></script>
    <script src="js/physics/ForceSystem.js"></script>
    
    <!-- Entity System -->
    <script src="js/entities/BodyPart.js"></script>
    <script src="js/entities/RagdollTypes.js"></script>
    <script src="js/physics/RagdollBuilder.js"></script>
    
    <!-- Rendering System -->
    <script src="js/rendering/ParticleSystem.js"></script>
    <script src="js/rendering/Renderer.js"></script>
    <script src="js/rendering/UIRenderer.js"></script>
    
    <!-- Input System -->
    <script src="js/input/DragSystem.js"></script>
    <script src="js/input/InputManager.js"></script>
    
    <!-- Audio System -->
    <script src="js/audio/GameAudio.js"></script>
    
    <!-- Main Game Controller -->
    <script src="js/game.js"></script>
</body>
</html>
