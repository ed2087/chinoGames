<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Path Home Game</title>
    <script src="../../js/global.js"></script>
    <link rel="stylesheet" href="../../styles/global.css">
    <link rel="stylesheet" href="game.css">
</head>
<body>
    <nav class="app-nav">
        <a href="../../index.html" class="nav-back">← Games</a>
        <h1 class="nav-title">Path Home</h1>
        <div class="nav-spacer"></div>
    </nav>
    
    <main class="game-main">
        <canvas id="gameCanvas"></canvas>
        <canvas id="drawingCanvas" style="position: absolute; top: 0; left: 0; pointer-events: none;"></canvas>
        
        <div class="game-ui">
            <div class="help-text">Start on me and draw a path home - avoid the rocks!</div>
            <button id="nextLevel" class="btn btn-primary" style="display: none;">Next Friend</button>
        </div>
    </main>
    
    
    <!-- Load in order -->
    <script src="../../js/audio-system.js"></script>
    <script src="canvas-animals.js"></script>
    <script src="path-generator.js"></script>
    <script src="drawing-engine.js"></script>
    <script src="particle-generator.js"></script>
    <script src="audio-synthesizer.js"></script>
    <script src="level-manager.js"></script>
    <script src="main.js"></script>
</body>
</html>
