<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Shape Builder Sandbox</title>
    <script src="../../js/global.js"></script>
    <link rel="stylesheet" href="../../styles/global.css">
    <link rel="stylesheet" href="game.css">


        <!-- PWA & Icon support - ADD THESE -->
    <link rel="icon" type="image/png" sizes="192x192" href="../../icons/icon-192.png">
    <link rel="icon" type="image/png" sizes="512x512" href="../../icons/icon-512.png">
    <link rel="apple-touch-icon" href="../../icons/icon-192.png">
    <link rel="manifest" href="../../manifest.json">
    <meta name="theme-color" content="#4A90E2">
</head>
<body>
    <nav class="app-nav">
        <a href="../../index.html" class="nav-back">← Games</a>
        <h1 class="nav-title">Shape Builder</h1>
        <button id="resetBtn" class="reset-btn">🗑️ Clear All</button>
    </nav>
    
    <main class="game-main">
        <!-- Main game canvas -->
        <div class="game-container">
            <canvas id="gameCanvas"></canvas>
            <canvas id="particleCanvas"></canvas>
            
            <!-- Danger zone indicators -->
            <div class="danger-zone left"></div>
            <div class="danger-zone right"></div>
        </div>
        
        <!-- Shape palette -->
        <div class="shape-palette" id="shapePalette">
            <div class="palette-shape" data-shape="square">
                <div class="shape-icon square-icon"></div>
                <span class="shape-label">Square</span>
            </div>
            <div class="palette-shape" data-shape="rectangle">
                <div class="shape-icon rectangle-icon"></div>
                <span class="shape-label">Rectangle</span>
            </div>
            <div class="palette-shape" data-shape="triangle">
                <div class="shape-icon triangle-icon"></div>
                <span class="shape-label">Triangle</span>
            </div>
            <div class="palette-shape" data-shape="circle">
                <div class="shape-icon circle-icon"></div>
                <span class="shape-label">Circle</span>
            </div>
            <div class="palette-shape" data-shape="star">
                <div class="shape-icon star-icon"></div>
                <span class="shape-label">Star</span>
            </div>
        </div>
    </main>
    
    <!-- Load Matter.js -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/matter-js/0.19.0/matter.min.js"></script>
    
    <!-- Load audio system -->
    <script src="../../js/audio-system.js"></script>
    
    <!-- Load game modules -->
    <script src="js/particles.js"></script>
    <script src="js/physics.js"></script>
    <script src="js/shapes.js"></script>
    <script src="js/ui.js"></script>
    <script src="js/game.js"></script>
</body>
</html>
