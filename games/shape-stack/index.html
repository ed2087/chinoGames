<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Shape Stack Tower</title>
    <script src="../../js/global.js"></script>
    <link rel="stylesheet" href="../../styles/global.css">
    <link rel="stylesheet" href="game.css">


        <!-- PWA & Icon support - ADD THESE -->
    <link rel="icon" type="image/png" sizes="192x192" href="../../icons/icon-192.png">
    <link rel="icon" type="image/png" sizes="512x512" href="../../icons/icon-512.png">
    <link rel="apple-touch-icon" href="../../icons/icon-192.png">
    <link rel="manifest" href="../../manifest.json">
    <meta name="theme-color" content="#4A90E2">
</head>
<body>
    <nav class="app-nav">
        <a href="../../index.html" class="nav-back">← Games</a>
        <h1 class="nav-title">Shape Stack Tower</h1>
        <div class="nav-spacer"></div>
    </nav>
    
    <main class="game-main">
        <!-- Game UI -->
        <div class="game-ui">
            <div class="level-info">
                <span class="level-text">Level <span id="levelNumber">1</span></span>
                <div class="progress-bar">
                    <div class="progress-fill" id="progressFill"></div>
                </div>
            </div>
            
            <button id="resetBtn" class="reset-btn">🔄 Reset Tower</button>
        </div>
        
        <!-- Game Canvas Container -->
        <div class="game-container">
            <div class="target-line" id="targetLine">
                <div class="target-text">Reach Here!</div>
                <div class="lightning-effects"></div>
                <div class="fire-particles"></div>
            </div>
            <canvas id="gameCanvas"></canvas>
            <div class="celebration-overlay" id="celebrationOverlay"></div>
        </div>
        
        <!-- Shape Palette -->
        <div class="shape-palette" id="shapePalette">
            <!-- Dynamic shape buttons will be added here -->
        </div>
    </main>
    
    <!-- Load audio system BEFORE game.js -->
    <script src="../../js/audio-system.js"></script>
    <script src="game.js"></script>
</body>
</html>
