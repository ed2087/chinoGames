<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-fullscreen">
    <meta name="mobile-web-app-capable" content="yes">
    
    <title>Feed the Face - Number Learning</title>
    
    <!-- Global Scripts -->
    <script src="../../js/global.js"></script>
    
    <!-- Game Scripts - LOCAL FILES -->
    <script src="utils.js"></script>
    <script src="audio-system.js"></script>
    <script src="face.js"></script>
    <script src="food-manager.js"></script>
    <script src="game.js"></script>
    
    <!-- Styles -->
    <link rel="stylesheet" href="../../styles/global.css">
    <link rel="stylesheet" href="game.css">
</head>
<body>
    <!-- Main Game Container -->
    <div class="game-container">
        
        <!-- Top Bar -->
        <div class="top-bar">
            <a id="homeBtn" href="../../index.html" class="home-btn" aria-label="Home">🏠</a>
            <div class="score-display">
                <span class="score-label">Stars:</span>
                <span id="scoreValue">0</span>
                <span class="star-icon">⭐</span>
            </div>
            <button id="settingsBtn" class="btn-icon">⚙️</button>
        </div>
        
        <!-- Face Container -->
        <div class="face-section">
            <div id="faceContainer" class="face-container">
                <canvas id="faceCanvas"></canvas>
            </div>
            
            <!-- Number Display -->
            <div id="numberDisplay" class="number-display">
                <span id="targetNumber">3</span>
            </div>
        </div>
        
        <!-- Food Shelf -->
        <div class="food-section">
            <div class="food-shelf" id="foodShelf">
                <!-- Food items will be generated by food-manager.js -->
            </div>
        </div>
        
        <!-- Drop Zone / Plate -->
        <div class="drop-zone-section">
            <div id="dropZone" class="drop-zone">
                <div class="drop-zone-content">
                    <div class="plate">
                        <div id="plateItems" class="plate-items">
                            <!-- Fed items appear here -->
                        </div>
                    </div>
                    <div class="counter">
                        <span id="currentCount">0</span>
                        <span class="separator">/</span>
                        <span id="targetCount">3</span>
                    </div>
                </div>
            </div>
        </div>
        
    </div>
    
    <!-- Celebration Overlay -->
    <div id="celebrationOverlay" class="celebration-overlay hidden">
        <div class="celebration-content">
            <div class="celebration-message">🎉</div>
            <button id="nextRoundBtn" class="btn btn-primary btn-large">
                Next Number!
            </button>
        </div>
    </div>
    
    <!-- Loading Screen -->
    <div id="loadingScreen" class="loading-screen">
        <div class="loading-content">
            <div class="loading-spinner">😊</div>
            <p>Loading the hungry face...</p>
        </div>
    </div>
    
</body>
</html>
