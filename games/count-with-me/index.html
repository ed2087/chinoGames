<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-fullscreen">
    <meta name="mobile-web-app-capable" content="yes">
    
    <title>Count With Me - Number Learning</title>
    
    <!-- Global Scripts -->
    <script src="../../js/global.js"></script>
    
    <!-- Audio System - Check where your file is located -->
    <!-- If it's in js/audio-system.js: -->
    <script src="../../js/audio-system.js"></script>
    
    <!-- OR if it's in gameUtils/audio-system.js: -->
    <!-- <script src="../../gameUtils/audio-system.js"></script> -->
    
    <!-- Game Scripts -->
    <script src="counting-box.js"></script>
    <script src="game.js"></script>
    
    <!-- Styles -->
    <link rel="stylesheet" href="../../styles/global.css">
    <link rel="stylesheet" href="game.css">
</head>
<body>
    <!-- Main Game Container -->
    <div class="game-container">
        
        <!-- Top Bar -->
        <div class="top-bar">
            <button id="homeBtn" class="btn-icon">🏠</button>
            <div class="score-display">
                <span class="score-label">Stars:</span>
                <span id="scoreValue">0</span>
                <span class="star-icon">⭐</span>
            </div>
            <button id="settingsBtn" class="btn-icon">⚙️</button>
        </div>
        
        <!-- Main Content Area -->
        <div class="content-area">
            
            <!-- Left Side - NUMBER -->
            <div class="number-side">
                <div id="numberDisplay" class="number-display">
                    <span id="bigNumber">6</span>
                </div>
                <div id="numberLabel" class="number-label">
                    This is SIX
                </div>
            </div>
            
            <!-- Right Side - COUNTING BOX -->
            <div class="box-side">
                <div id="countingBox" class="counting-box">
                    <!-- Food items will be generated here -->
                </div>
                <div id="instruction" class="instruction">
                    Tap each cookie to count!
                </div>
            </div>
            
        </div>
        
    </div>
    
    <!-- Celebration Overlay -->
    <div id="celebrationOverlay" class="celebration-overlay hidden">
        <div class="celebration-content">
            <div class="celebration-message">
                <div class="celebration-number" id="celebrationNumber">6</div>
                <div class="celebration-text">Great Job!</div>
            </div>
            <button id="nextRoundBtn" class="btn btn-primary btn-large">
                Count More!
            </button>
        </div>
    </div>
    
    <!-- Loading Screen -->
    <div id="loadingScreen" class="loading-screen">
        <div class="loading-content">
            <div class="loading-spinner">🔢</div>
            <p>Loading numbers...</p>
        </div>
    </div>
    
</body>
</html>
