<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-fullscreen">
    <meta name="mobile-web-app-capable" content="yes">
    
    <title>Number Memory Match</title>
    
    <!-- Global Scripts -->
    <script src="../../js/global.js"></script>
    <script src="../../js/audio-system.js"></script>
    
    <!-- Game Scripts -->
    <script src="card-manager.js"></script>
    <script src="game.js"></script>
    
    <!-- Styles -->
    <link rel="stylesheet" href="../../styles/global.css">
    <link rel="stylesheet" href="game.css">
</head>
<body>
    <!-- Main Game Container -->
    <div class="game-container">
        
        <!-- Top Bar -->
        <div class="top-bar">
            <button id="homeBtn" class="btn-icon">🏠</button>
            
            <div class="pairs-display">
                <span class="pairs-label">Pairs:</span>
                <span id="pairsValue">0/3</span>
            </div>
            
            <div class="score-display">
                <span class="score-label">Stars:</span>
                <span id="scoreValue">0</span>
                <span class="star-icon">⭐</span>
            </div>
        </div>
        
        <!-- Game Area -->
        <div class="game-area">
            
            <!-- Card Grid -->
            <div class="card-grid" id="cardGrid">
                <!-- Cards will be generated here -->
            </div>
            
        </div>
        
    </div>
    
    <!-- Win Overlay -->
    <div id="winOverlay" class="overlay hidden">
        <div class="overlay-content">
            <h1>🎉 Great Job! 🎉</h1>
            <p class="win-message">You matched all the pairs!</p>
            <div class="final-score">
                <p>Stars Earned: <span id="finalScore">0</span> ⭐</p>
            </div>
            <button id="nextRoundBtn" class="btn btn-primary btn-large">
                Next Round!
            </button>
        </div>
    </div>
    
    <!-- Start Overlay -->
    <div id="startOverlay" class="overlay">
        <div class="overlay-content">
            <h1>Number Memory!</h1>
            <p class="game-instructions">Match the pairs of numbers!</p>
            <div class="game-rules">
                <p>🃏 Flip 2 cards</p>
                <p>🎯 Find matching numbers</p>
                <p>⭐ Match all 3 pairs!</p>
            </div>
            <button id="startBtn" class="btn btn-primary btn-large">
                Start Game!
            </button>
        </div>
    </div>
    
</body>
</html>
