<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="mobile-web-app-capable" content="yes">
    <title>Color the Shapes</title>
    <script src="../../js/global.js"></script>
    <link rel="stylesheet" href="../../styles/global.css">
    <link rel="stylesheet" href="game.css">

        <!-- PWA & Icon support - ADD THESE -->
    <link rel="icon" type="image/png" sizes="192x192" href="../../icons/icon-192.png">
    <link rel="icon" type="image/png" sizes="512x512" href="../../icons/icon-512.png">
    <link rel="apple-touch-icon" href="../../icons/icon-192.png">
    <link rel="manifest" href="../../manifest.json">
    <meta name="theme-color" content="#4A90E2">
</head>
<body>
    <div class="game-container">
        <header class="game-header">
            <a href="../../index.html" class="back-btn">← Back</a>
            <div class="game-title">Color the Shapes!</div>
            <div class="controls-top">
                <button class="clear-btn" id="clearBtn">Clear</button>
            </div>
        </header>
        
        <main class="coloring-area">
            <div class="canvas-container">
                <canvas id="coloringCanvas"></canvas>
                <div class="shape-label">Circle</div>
                <button id="nextBtn" class="next-btn">
                    <span>Next</span>
                    <svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"><line x1="5" y1="12" x2="19" y2="12"></line><polyline points="12 5 19 12 12 19"></polyline></svg>
                </button>
            </div>
        </main>
        
        <div class="bottom-controls">
            <div class="color-palette">
                <!-- Colors will be generated by JavaScript -->
            </div>
        </div>
    </div>
    
    <!-- Load audio system BEFORE game.js -->
    <script src="../../js/audio-system.js"></script>
    <script src="game.js"></script>
</body>
</html>
